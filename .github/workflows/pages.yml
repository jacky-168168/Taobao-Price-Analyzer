name: 部署淘寶價格分析網站
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式
        uses: actions/checkout@v4
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 建立靜態網站檔案
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/provider_history.json _site/data/provider_history.json
      - name: 上傳網頁檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 部署網站
        id: deployment
        uses: actions/deploy-pages@v4
